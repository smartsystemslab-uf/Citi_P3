[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-trust-pdp-task4-secure"
version = "1.0.0"
description = "Security-hardened Zero Trust Backplane Task 4 PDP using interface standard v1.0 unchanged"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "cryptography>=43,<48",
  "jsonschema>=4.23,<5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
