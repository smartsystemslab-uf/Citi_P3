# ============================================================
# Interaction Edges — ZT-IR Manifest
# Citi Banking ADK  |  Task 1 Deliverable
#
# This file is the COMPLETE directed relationship graph of the system.
# It covers four edge types:
#
#   agent_to_agent   — authorized control transfers between agents
#   agent_to_tool    — agents calling their authorized tools
#   tool_to_api      — ADK/MCP tools invoking FastAPI endpoints
#   api_to_database  — API endpoints reading/writing database tables
#
# Together these four layers describe the full chain:
#   Agent → Tool → API → Database → (Ledger)
#
# The PEP generator reads this file to place enforcement points
# at every edge where pep_required=true.
#
# operation_class mapping:
#   read           — GET queries with no side effects
#   write          — non-financial state changes
#   financial      — financial_write with monetary effect
#   sensitive_data — operations touching PII fields
#   critical       — risk_level 5, irreversible, ledger mutations
# ============================================================

