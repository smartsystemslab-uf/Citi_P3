# ============================================================
# Identity Context — ZT-IR Manifest
# Citi Banking ADK  |  Phase 1 Step 5
#
# Defines what "identity" means in this system at Phase 1.
# Full SPIFFE/SPIRE workload identity is deferred to Phase 4.
# This file captures the minimum identity model needed for
# the PEP/PDP decision request (slide 7 of the proposal).
#
# The identity context is assembled by the input PEP at the
# start of every session and propagated (downscoped) through
# the agent chain by the route PEP at each transfer.
# ============================================================

zt_ir_version: "1.0"
manifest_type: identity_context

# ── Phase 1 identity model ────────────────────────────────────
# Minimum required — no SPIFFE, no mTLS yet.
# These fields must be present on every PDP decision request.

identity_model:
  version: "phase1"
  note: >
    Phase 1 uses token-based identity. Cryptographic workload identity
    (SPIFFE SVIDs) is introduced in Phase 4. The field names and structure
    are designed to be backward-compatible with Phase 4 additions.

# ── Required claims ───────────────────────────────────────────
# Every PDP decision request MUST carry these fields.
# A missing required claim is treated as DENY.

required_claims:

  session_id:
    type: string
    format: uuid-v4
    description: >
      Unique identifier for this user session. Generated by the input PEP
      at the moment a request arrives. All subsequent PDP calls within the
      same workflow share this session_id, allowing the audit plane to
      reconstruct the full decision chain for one request.
    example: "7f3c1a2b-9d4e-4f8a-b1c2-3d4e5f6a7b8c"
    pep_generated: true

  agent_id:
    type: string
    description: >
      The name of the agent making the current PDP request. Must match
      exactly one entry in agents.yaml. The PEP sets this from the ADK
      agent name — the agent does not self-report it.
    example: "transaction_processing_agent"
    pep_generated: true
    # In Phase 4 this will be replaced by the SPIFFE SVID URI:
    # spiffe://citi.internal/agent/transaction_processing_agent

  user_role:
    type: string
    enum:
      - customer
      - internal_rep
      - ops_scheduler
      - system
      - auditor
    description: >
      Role of the human or system that initiated the session.
      Set by the input PEP from the verified JWT claim.
      Propagated unchanged through the agent chain — no agent can
      elevate its own user_role.
    examples:
      customer:      "Retail banking customer initiating a transaction"
      internal_rep:  "CSR or relationship manager using the representative-assist workflow"
      ops_scheduler: "Operations team member running mid-office planning"
      system:        "Automated scheduler — the only role that may trigger EOD workflows"
      auditor:       "Read-only compliance auditor — cannot initiate any write operations"

  workflow_state:
    type: object
    description: >
      A map of state keys to their completion status. Allows the route PEP
      and tool PEP to verify that required upstream pipeline steps have
      been completed before allowing an action.
      Updated by the route PEP after each successful agent completion.
    structure:
      "<state_key>":
        status:    ENUM(pending, complete, failed, skipped)
        completed_by: string   # agent_id that wrote this key
        timestamp: iso8601
    example:
      fo_monitoring_report:
        status: complete
        completed_by: transaction_monitoring_agent
        timestamp: "2026-07-20T14:23:01Z"
      fo_fraud_report:
        status: complete
        completed_by: fraud_detection_agent
        timestamp: "2026-07-20T14:23:04Z"
      fo_compliance_report:
        status: pending
        completed_by: null
        timestamp: null

# ── Optional claims ───────────────────────────────────────────
# Enriched by the Identity & Context Plane when available.
# Missing optional claims never cause a deny — they may reduce
# the richness of the policy decision (e.g., risk context missing
# → PDP must use conservative defaults).

optional_claims:

  risk_context:
    type: object
    description: >
      Transaction or operational risk signals. Populated by the front-office
      monitoring agents and read by the decision PEP for execute_transfer
      and submit_manual_review decisions.
    fields:
      transaction_amount:
        type: number
        description: Amount in the base currency of the transaction
      risk_tier:
        type: string
        enum: [low, medium, high, critical]
      aml_cleared:
        type: boolean
        description: True if AML check completed without flags
      fraud_risk:
        type: string
        enum: [low, medium, high]
      manual_review_needed:
        type: boolean

  user_id:
    type: string
    description: >
      Authenticated end-user identifier from the OIDC token.
      Present for customer and internal_rep sessions.
      Absent for system-initiated sessions (ops_scheduler, system).
    pii: true

  device_context:
    type: object
    description: >
      Channel and device signals. Used by the input PEP for anomaly detection
      and by the audit plane for forensic correlation.
    fields:
      channel:
        type: string
        enum: [mobile, web, api, branch, internal]
      ip_address:
        type: string
        pii: true
      user_agent:
        type: string

# ── Propagation rules ─────────────────────────────────────────
# How the identity context flows through the agent chain.

propagation:
  scope: session
  # The session_id never changes within one request lifecycle.
  # This ties every PDP decision in the chain to the same audit record.

  strategy: downscope
  # At each agent-to-agent transfer, the route PEP produces a downscoped
  # context token containing only the claims the receiving agent needs.
  # A back_office agent should not receive front-office fo_* state keys.
  # Downscoping is defined per-domain in the downscope_rules below.

  ttl_seconds: 3600
  # Maximum lifetime of any session context token.
  # After 3600 seconds the session is invalid and must be re-authenticated.
  # For EOD batch workflows (system role), this may be extended to 14400.

  downscope_rules:

    - from_domain: root
      to_domain: front
      retained_claims:
        - session_id
        - agent_id
        - user_role
        - user_id
        - device_context
        - risk_context
      dropped_claims:
        - workflow_state keys prefixed with mo_ or bo_

    - from_domain: root
      to_domain: mid
      retained_claims:
        - session_id
        - agent_id
        - user_role
        - user_id
      dropped_claims:
        - workflow_state keys prefixed with fo_ or bo_
        - risk_context
        - device_context

    - from_domain: root
      to_domain: back
      retained_claims:
        - session_id
        - agent_id
        - user_role
      dropped_claims:
        - user_id
        - device_context
        - risk_context
        - workflow_state keys prefixed with fo_ or mo_

# ── PDP decision request format ───────────────────────────────
# The exact structure the PEP sends to the PDP.
# Defined here so Phase 3 (PEP generation) and Phase 4 (PDP) share
# the same contract.

pdp_decision_request:
  subject:
    session_id:    string        # from required_claims
    agent_id:      string        # from required_claims
    user_role:     string        # from required_claims
    workflow_state: object       # from required_claims
    risk_context:  object        # from optional_claims (null if absent)
  resource:
    tool_id:       string        # tool being called (or transfer_target for route PEP)
    action:        string        # call / read / write / transfer / output
  request:
    args_hash:     string        # SHA-256 of serialized arguments
    args_schema:   object        # argument field names and types (not values)
    timestamp:     iso8601
  context:
    policy_version: string       # version of the active policy bundle
    identity_epoch: string       # version of the identity store at request time

pdp_decision_response:
  decision:         ENUM(allow, deny, require_manual_review)
  permit_lease:
    # Only present when decision == allow
    request_hash:   string       # binds this permit to exact parameters
    expires_at:     iso8601      # short-lived — typically 60 seconds
    max_uses:       integer      # 1 for financial writes, higher for reads
    policy_version: string       # invalidates if policy changes mid-session
    identity_epoch: string       # invalidates if identity store changes
    signature:      string       # HMAC — prevents the PEP from forging a permit locally
  denial_reason:    string       # present when decision == deny
  obligations:
    - audit_log
    - emit_financial_event
    - alert_security_team
    # ... as defined in the matching policy_rule
